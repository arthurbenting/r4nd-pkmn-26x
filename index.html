<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Randomizer — Figuras Públicas</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#3f3f3f;font-family:Arial,sans-serif}
body{touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#cameraArea{height:50%;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}
#camera{width:100%;height:100%;object-fit:contain;transform:scaleX(-1);background:#111}
#randomArea{height:50%;background:#3f3f3f;display:flex;align-items:center;justify-content:center;cursor:pointer}
#circle{width:44vw;height:44vw;max-width:230px;max-height:230px;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 2px 12px #0003;transition:transform .07s}
#portrait{width:100%;height:100%;object-fit:cover;display:block}
#placeholder{width:100%;height:100%;background:#fff}
.rolling #circle{transform:scale(.96)}
#start{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#111;color:#fff;text-align:center;padding:30px}
#start>div{max-width:420px}
#start h1{margin:0 0 12px;font-size:32px}
#start p{margin:0 0 22px;color:#bbb;line-height:1.4}
#start button{border:0;border-radius:999px;padding:16px 25px;font-size:17px;font-weight:800}
#status{font-size:13px;color:#aaa;margin-top:14px}
</style>
</head>
<body>
<div id="app">
 <div id="cameraArea"><video id="camera" autoplay muted playsinline></video></div>
 <div id="randomArea"><div id="circle"><div id="placeholder"></div><img id="portrait" alt="" hidden></div></div>
</div>
<div id="start"><div>
 <h1>Randomizer</h1>
 <p>Ative a câmera frontal. Depois toque na metade inferior para sortear uma foto.</p>
 <button id="cameraBtn">ATIVAR CÂMERA</button><div id="status"></div>
</div></div>
<script>
const people=[
 ["Flávio Bolsonaro","Flávio_Bolsonaro"],
 ["Lula","Luiz_Inácio_Lula_da_Silva"],
 ["Daniel Vorcaro","Daniel_Vorcaro"],
 ["Flávio Dino","Flávio_Dino"],
 ["Alexandre de Moraes","Alexandre_de_Moraes"],
 ["André Mendonça","André_Mendonça"]
];
const camera=document.getElementById("camera"),portrait=document.getElementById("portrait"),
placeholder=document.getElementById("placeholder"),randomArea=document.getElementById("randomArea"),
start=document.getElementById("start"),cameraBtn=document.getElementById("cameraBtn"),status=document.getElementById("status");
let bag=[],rolling=false,photos=new Map();

function refill(){bag=[...Array(people.length).keys()];for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}
async function getPhoto(i){
 if(photos.has(i))return photos.get(i);
 try{
  const r=await fetch("https://pt.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(people[i][1]));
  const d=await r.json();
  const src=(d.thumbnail&&d.thumbnail.source)||(d.originalimage&&d.originalimage.source)||"";
  photos.set(i,src);return src;
 }catch(e){return ""}
}
async function display(i){
 const src=await getPhoto(i);
 if(src){portrait.src=src;portrait.hidden=false;placeholder.hidden=true}
 else{portrait.hidden=true;placeholder.hidden=false}
}
async function draw(){
 if(rolling)return;if(!bag.length)refill();rolling=true;document.body.classList.add("rolling");
 let ticks=0;
 const timer=setInterval(()=>{
  const i=Math.floor(Math.random()*people.length),src=photos.get(i);
  if(src){portrait.src=src;portrait.hidden=false;placeholder.hidden=true}
  if(++ticks>=14){clearInterval(timer);display(bag.pop()).then(()=>{rolling=false;document.body.classList.remove("rolling")})}
 },70);
}
cameraBtn.onclick=async()=>{
 status.textContent="Abrindo câmera…";
 try{
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
  camera.srcObject=stream;await camera.play();start.style.display="none";refill();people.forEach((_,i)=>getPhoto(i));
 }catch(e){status.textContent="Não foi possível abrir a câmera. Verifique a permissão do navegador."}
};
randomArea.addEventListener("click",draw);
</script>
</body>
</html>
